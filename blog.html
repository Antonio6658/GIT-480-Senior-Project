<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="description" content="Mentor Connection: A multi-thread forum to connect with other users who enjoy similar hobbies!">
    <meta name="author" content="Antonio Rodriguez Jr">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentor Connection: Connect with other users and discuss relevant topics!</title>
    <link rel="stylesheet" href="styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="nav-container">
            <a class="site-logo" href="#">Mentor Connection</a>
            <nav>
                <ul class="nav-list">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="search.html">Search</a></li>
                    <li><a aria-current="page" href="#">Blog</a></li>
                    <li><a href="profile.html">Profile</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <h1>Mentor Connection Threads</h1>
        <form class="blog">
            <label for="title">Title</label>
            <input type="text" id="title">

            <label for="category">Topic Category</label>
            <select id="category">
                <option value="food">Food Hobbies</option> 
                <option value="gaming">Gaming Hobbies</option> 
                <option value="creative">Creative Hobbies</option> 
                <option value="exercise">Exercise Hobbies</option> 
            </select>

            <label for="content">Message</label>
            <textarea id="content" rows="5"></textarea>

            <button type="submit">Publish Post</button>
        </form>
        <div class="userpost"></div>
    </main>
    <footer><p>&copy; Copyright 2026<br>
                All rights reserved.</p></footer>
</body>
</html>
