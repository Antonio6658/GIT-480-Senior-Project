<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="description" content="Mentor Connection: Review your profile details and settings, find your next scheduled meeting">
    <meta name="author" content="Antonio Rodriguez Jr">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentor Connection: Profile details and meeting updates!</title>
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="#">Mentor Connection</a>
            <nav>
                <ul class="nav-list">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="search.html">Search</a></li>
                    <li><a href="blog.html">Blog</a></li>
                    <li><a aria-current="page" href="#">Profile</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <h1>Profile</h1>
        <section>
            <h2>Settings</h2>
            <form>
                <label for="name">Username:</label>
                <input type="text" id="name" name="name">

                <label for="desc">Bio:</label>
                <input type="text" id="desc" name="desc">

                <label for="hobby">Hobby Preference:</label>
                <input type="text" id="hobby" name="hobby">

                <button type="submit">Update</button>
            </form>
        </section>

        <section>
            <h2>Inbox</h2>
            <form>
                <label for="usermsg">Sender ID:</label>
                <input type="text" id="usermsg" name="usermsg">
                <label for="message">Message:</label>
                <textarea id="message" rows="3"></textarea>
                <button type="submit">Send Message</button>
            </form>
        </section>

        <section>
            <h2>Upcoming Meetings</h2>
            <div></div>
        </section>
        
    </main>
    <footer><p>&copy; Copyright 2026<br>
                All rights reserved.</p></footer>
</body>
</html>
